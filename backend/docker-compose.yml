
services:
  postgres:
    image: postgres:17
    container_name: bharat-batteries-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bharat_batteries
      POSTGRES_USER: bharat_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - bharat_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bharat_app -d bharat_batteries"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bharat_postgres_data:
